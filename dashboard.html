
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinPulse AI — AI-Powered Financial Tracker & Budget Manager</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-container" class="app-layout app-shell-hidden">

    <!-- Sidebar Navigation -->
    <aside id="dashboard-sidebar" class="sidebar" aria-label="Dashboard navigation">
      <div class="sidebar-header">
        <a class="brand-logo brand-home-link" href="./dashboard.html" aria-label="Open FinPulse AI dashboard">
          <div class="logo-icon-wrap">
            <img src="./images/logo.png" alt="FinPulse AI logo" />
          </div>
          <div class="brand-text">
            <span class="brand-title">FinPulse<span class="highlight-ai">AI</span></span>
            <span class="brand-subtitle">Smart Budget Intelligence</span>
          </div>
        </a>
        <button id="mobile-menu-close" class="btn-icon sidebar-close-btn mobile-only" type="button" aria-label="Close navigation menu">
          <i data-lucide="x"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="dashboard">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="income">
          <i data-lucide="trending-up"></i>
          <span>Income</span>
        </button>
        <button class="nav-item" data-view="expenses">
          <i data-lucide="receipt"></i>
          <span>Expenses</span>
        </button>
        <button class="nav-item" data-view="goals">
          <i data-lucide="target"></i>
          <span>Goals</span>
        </button>
        <button class="nav-item" data-view="budgetbot">
          <i data-lucide="bot"></i>
          <span>BudgetBot</span>
          <span class="badge badge-glow">AI</span>
        </button>
        <button class="nav-item" data-view="settings">
          <i data-lucide="settings"></i>
          <span>Settings</span>
        </button>
      </nav>
    </aside>

    <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation menu" hidden></button>

    <!-- Main Content Region -->
    <main class="main-content">
      <!-- Top Navbar Header -->
      <header class="top-header dashboard-top-header">

        <div class="header-left">
          <button id="mobile-menu-toggle" class="btn-icon mobile-only" type="button" aria-label="Open navigation menu" aria-controls="dashboard-sidebar" aria-expanded="false">
            <i data-lucide="menu"></i>
          </button>
          <div class="page-title-wrap">
            <h1 id="view-title">Financial Overview</h1>
            <p id="view-subtitle" class="text-muted">Real-time spend analytics and intelligent insights</p>
          </div>
        </div>

        <div class="header-actions">
          <!-- Currency Selector -->
          <div class="select-wrapper">
            <i data-lucide="coins" class="select-icon"></i>
            <select id="currency-select" class="custom-select">
              <option value="USD">🇺🇸 USD ($)</option>
              <option value="EUR">🇪🇺 EUR (€)</option>
              <option value="GBP">🇬🇧 GBP (£)</option>
              <option value="INR">🇮🇳 INR (₹)</option>
              <option value="JPY">🇯🇵 JPY (¥)</option>
              <option value="CAD">🇨🇦 CAD (CA$)</option>
              <option value="AUD">🇦🇺 AUD (A$)</option>
              <option value="CHF">🇨🇭 CHF (CHF)</option>
              <option value="CNY">🇨🇳 CNY (¥)</option>
              <option value="AED">🇦🇪 AED (AED)</option>
              <option value="BRL">🇧🇷 BRL (R$)</option>
              <option value="SGD">🇸🇬 SGD (S$)</option>
            </select>
          </div>

          <!-- Dark/Light Theme Toggle -->
          <button id="theme-toggle" class="btn-icon" title="Toggle Theme">
            <i data-lucide="sun" class="sun-icon"></i>
            <i data-lucide="moon" class="moon-icon"></i>
          </button>

          <!-- User Identity Badge -->
          <div id="user-profile-badge" class="user-profile-badge" title="Click to edit name or switch profile">
            <div id="user-avatar-text" class="user-avatar">?</div>
            <div class="user-info-text">
              <span class="user-greeting">Welcome back,</span>
              <span id="user-display-name" class="user-name">Guest User</span>
            </div>
            <i data-lucide="edit-2" style="width: 13px; height: 13px; color: var(--text-muted); margin-left: 2px;"></i>
          </div>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <div id="view-container" class="view-stage">
        <!-- Rendered dynamically by JavaScript -->
      </div>
    </main>
  </div>

  <!-- Global Transaction Modal -->
  <div id="transaction-modal" class="modal-overlay hidden">
    <div class="modal-content glass-card animate-pop">
      <div class="modal-header">
        <h3 id="modal-title">New Transaction</h3>
        <button id="modal-close" class="btn-icon-sm"><i data-lucide="x"></i></button>
      </div>
      <form id="transaction-form" class="modal-body">
        <input type="hidden" id="tx-id" value="">

        <div class="form-row">
          <div class="form-group">
            <label for="tx-type">Type</label>
            <select id="tx-type" class="custom-input" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tx-currency">Tx Currency</label>
            <select id="tx-currency" class="custom-input" required>
              <option value="">Select currency</option>
              <option value="USD">🇺🇸 USD ($)</option>
              <option value="EUR">🇪🇺 EUR (€)</option>
              <option value="GBP">🇬🇧 GBP (£)</option>
              <option value="INR">🇮🇳 INR (₹)</option>
              <option value="JPY">🇯🇵 JPY (¥)</option>
              <option value="CAD">🇨🇦 CAD (CA$)</option>
              <option value="AUD">🇦🇺 AUD (A$)</option>
              <option value="CHF">🇨🇭 CHF (CHF)</option>
              <option value="CNY">🇨🇳 CNY (¥)</option>
              <option value="AED">🇦🇪 AED (AED)</option>
              <option value="BRL">🇧🇷 BRL (R$)</option>
              <option value="SGD">🇸🇬 SGD (S$)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tx-amount">Amount</label>
            <div class="input-with-prefix">
              <span class="currency-symbol-prefix" id="tx-currency-symbol">$</span>
              <input type="number" id="tx-amount" step="0.01" min="0.01" class="custom-input" placeholder="0.00" required>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="tx-title">Description / Merchant</label>
          <input type="text" id="tx-title" class="custom-input" placeholder="e.g. Whole Foods Market, Netflix, Salary" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tx-category">Category</label>
            <select id="tx-category" class="custom-input" required>
              <option value="Food & Dining">Food & Dining</option>
              <option value="Transportation">Transportation</option>
              <option value="Housing & Utilities">Housing & Utilities</option>
              <option value="Shopping & Tech">Shopping & Tech</option>
              <option value="Education">Education & Learning</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Health & Fitness">Health & Fitness</option>
              <option value="Subscriptions">Subscriptions</option>
              <option value="Income">Income / Freelance</option>
              <option value="Miscellaneous">Miscellaneous</option>
              <option value="Others">Others</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tx-date">Date</label>
            <input type="date" id="tx-date" class="custom-input" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tx-payment">Payment Method</label>
            <select id="tx-payment" class="custom-input">
              <option value="Credit Card">Credit Card</option>
              <option value="Debit Card">Debit Card</option>
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="Cash">Cash</option>
              <option value="Apple Pay / Wallet">Apple Pay / Digital</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tx-recurring">Recurring Subscription?</label>
            <select id="tx-recurring" class="custom-input">
              <option value="false">No (One-time)</option>
              <option value="monthly">Monthly</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Transaction</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Deposit Goal Modal -->
  <div id="goal-deposit-modal" class="modal-overlay hidden">
    <div class="modal-content glass-card animate-pop">
      <div class="modal-header">
        <h3 id="goal-modal-title">Contribute to Goal</h3>
        <button id="goal-modal-close" class="btn-icon-sm"><i data-lucide="x"></i></button>
      </div>
      <form id="goal-deposit-form" class="modal-body">
        <input type="hidden" id="goal-id" value="">
        <p id="goal-modal-subtitle" class="text-muted mb-3">Add savings toward your goal target.</p>
        <div class="form-group">
          <label for="goal-deposit-amount">Deposit Amount</label>
          <div class="input-with-prefix">
            <span class="currency-symbol-prefix">$</span>
            <input type="number" id="goal-deposit-amount" step="1" min="1" class="custom-input" placeholder="100" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="goal-modal-cancel" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-accent">Deposit Funds</button>
        </div>
      </form>
    </div>
  </div>

  

<div id="add-goal-modal" class="modal-overlay hidden">
  <div class="modal-content glass-card animate-pop">
    <div class="modal-header">
      <h3>Create Financial Goal</h3>
      <button type="button" id="add-goal-modal-close" class="btn-icon-sm">
        <i data-lucide="x"></i>
      </button>
    </div>

    <form id="add-goal-form" class="modal-body">

      
      <div class="form-group">
        <label for="new-goal-icon">Goal</label>
        <select id="new-goal-icon" class="custom-input">
          <option value="house">Dream Home</option>
          <option value="car">Vehicle</option>
          <option value="plane">Travel</option>
          <option value="graduation-cap">Education</option>
          <option value="shield-check">Emergency Fund</option>
          <option value="laptop">Technology</option>
          <option value="briefcase-business">Business</option>
          <option value="target">Other Goal</option>
        </select>
      </div>

      <!-- Target Amount -->
      <div class="form-group">
        <label for="new-goal-target">Total Amount for Dream Completion</label>
        <div class="input-with-prefix">
          <span id="new-goal-currency-symbol" class="currency-symbol-prefix">$</span>
          <input
            type="text"
            id="new-goal-target"
            class="custom-input"
            placeholder="100000"
            inputmode="decimal"
            required
          >
        </div>
      </div>

      <!-- Achievement Duration -->
      <div class="form-group">
        <label for="new-goal-duration">Time to Achieve Goal</label>
        <input
          type="number"
          id="new-goal-duration"
          class="custom-input"
          placeholder="Enter duration"
          min="1"
          step="1"
          required
        >
      </div>

      <div class="form-group">
        <label for="new-goal-duration-unit">Duration Unit</label>
        <select
          id="new-goal-duration-unit"
          class="custom-input"
          required
        >
          <option value="days">Days</option>
          <option value="months" selected>Months</option>
          <option value="years">Years</option>
        </select>
      </div>


      <div class="modal-footer">
        <button type="button" id="add-goal-cancel" class="btn btn-secondary">
          Cancel
        </button>
        <button type="submit" class="btn btn-accent">
          Create Goal
        </button>
      </div>

    </form>
  </div>
</div>


  <!-- Supabase & Main JavaScript Bundle -->
  <script type="module" src="js/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
