<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FinPulse AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            height: 100vh;
        }

        .chat-container {
            max-width: 800px;
            height: 100vh;
            margin: auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        .header h2 {
            margin: 0;
        }

        .header p {
            margin: 5px 0 0;
            color: #777;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            background: #e5edff;
            margin-left: auto;
        }

        .ai {
            background: #f1f1f1;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        #message {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        #sendButton {
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .message {
                max-width: 90%;
            }

            .header {
                padding: 15px;
            }

            #chat {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2>FinPulse AI 🤖</h2>
        <p>Your personal financial assistant</p>
    </div>

    <div id="chat">

        <div class="message ai">
            Hello! 👋 I'm FinPulse AI.

Ask me anything about budgeting, expenses, saving, or spending.
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Ask FinPulse AI..."
            autocomplete="off"
        >

        <button id="sendButton">
            Send
        </button>

    </div>

</div>

<script src="ai-chat.js"></script>

</body>
</html>
